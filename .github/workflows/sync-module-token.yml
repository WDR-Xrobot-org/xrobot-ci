# 组织模块令牌同步
#
# 把 WDR_MODULES_READ_TOKEN 分发到 XRobot BSP 与模块仓库，避免每新建一个
# 仓库都要手工配置 Secret。目标仓库来自 index.yaml 与
# ci/bsp-repositories.txt，不扫描仓库内容。
#
# 需要的 App 权限：
#   Metadata: read                 读取 App 安装覆盖的仓库
#   Secrets: write                 写入仓库 Actions Secret
# 需要的仓库 Secret（本仓库 xrobot-ci）：
#   WDR_MODULES_READ_TOKEN         要分发的只读令牌（访问私有模块与 xrobot-ci）
#   WDR_SYNC_APP_ID                组织 App 的 App ID
#   WDR_SYNC_APP_PRIVATE_KEY       组织 App 的私钥（PEM）
#
# 说明：installation token 只能访问 App 被安装的仓库。新增 BSP 仓库后需把
# 仓库加入 ci/bsp-repositories.txt，并确认 App 安装范围包含它；若希望完全自动，
# 由组织 owner 把 App 安装范围改为 All repositories。
name: 组织模块令牌同步

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只列出将更新的仓库，不写入
        type: boolean
        default: false
      extra_repos:
        description: 额外同步的仓库（逗号分隔，owner/repo），用于未匹配到 WDR CI 但确实需要的仓库
        type: string
        default: ''
  schedule:
    # 每天一次兜底；新仓库可手动触发立即同步。
    - cron: '17 2 * * *'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 生成 App 安装令牌
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.WDR_SYNC_APP_ID }}
          private-key: ${{ secrets.WDR_SYNC_APP_PRIVATE_KEY }}
          owner: HFUT-WDR

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 安装 PyNaCl
        run: python3 -m pip install --quiet pynacl

      - name: 同步到组织内各仓库
        env:
          SYNC_TOKEN: ${{ steps.token.outputs.token }}
          SYNC_VALUE: ${{ secrets.WDR_MODULES_READ_TOKEN }}
          SYNC_ORG: HFUT-WDR
          SYNC_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          SYNC_EXTRA_REPOS: ${{ inputs.extra_repos }}
        run: python3 ci/sync_module_token.py
